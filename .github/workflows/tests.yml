name: Testes Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -e '.[dev]'
      - name: Conferir versão e código
        run: |
          python -c "import localcast, tomllib; from pathlib import Path; assert localcast.__version__ == tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']"
          python -m ruff check src tests scripts --select E4,E7,E9,F,I
      - name: Testes sem integração FFmpeg
        run: python -m pytest -q -m 'not integration'

# Conversão real: validação local com FFmpeg (docs/TESTES.md).
# Não descobre Chromecast, não transmite à TV e não publica builds.
